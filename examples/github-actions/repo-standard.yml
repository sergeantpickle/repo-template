name: Repository standard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin this action to the immutable commit (or release tag) your project has adopted.
      - uses: sergeantpickle/repo-template@<PINNED_STANDARD_REF>
        with:
          strict: "false"
          check-latest: "true"
