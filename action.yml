name: Repository Growth Standard audit
description: Audit a checked-out repository against the pinned Repository Growth Standard and optionally check for a newer upstream standard.
inputs:
  project-path:
    description: Path to the project, relative to GITHUB_WORKSPACE.
    required: false
    default: .
  strict:
    description: Fail on active audit warnings.
    required: false
    default: "false"
  check-latest:
    description: Check upstream VERSION for a newer standard.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"
    - name: Audit repository organization
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        STRICT: ${{ inputs.strict }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_SERVER_URL: ${{ github.server_url }}
      run: |
        args=()
        if [[ "$STRICT" == "true" ]]; then
          args+=(--strict)
        fi
        python "$GITHUB_ACTION_PATH/scripts/audit_project.py" \
          "$GITHUB_WORKSPACE/$PROJECT_PATH" \
          --require-version-match \
          --require-source "$ACTION_SERVER_URL/$ACTION_REPOSITORY" \
          "${args[@]}"
    - name: Check for newer upstream standard
      if: ${{ inputs.check-latest == 'true' }}
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
      run: python "$GITHUB_ACTION_PATH/scripts/check_latest.py" "$GITHUB_WORKSPACE/$PROJECT_PATH"
